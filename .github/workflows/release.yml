name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semver module tag, for example v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  COVERAGE_THRESHOLD: "90.0"

defaults:
  run:
    shell: bash

jobs:
  tag-module:
    name: Tag Go module
    runs-on: ubuntu-24.04
    container:
      image: golang:1.26.5-alpine

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git github-cli make perl

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Validate release input
        env:
          VERSION: ${{ inputs.version }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "Release workflow must run from $DEFAULT_BRANCH, got $GITHUB_REF_NAME"
            exit 1
          fi

          if ! [[ "$VERSION" =~ ^v(0|1)\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "version must look like v0.1.0, v1.2.3, or v1.2.3-rc.1"
            echo "v2+ requires a /v2 module path before it can be released"
            exit 1
          fi

      - name: Check version is releasable
        id: version_state
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          git fetch --tags --force origin "+refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub release already exists: $VERSION"
            exit 1
          fi

          if git rev-parse -q --verify "refs/tags/$VERSION" >/dev/null; then
            tag_type="$(git cat-file -t "refs/tags/$VERSION")"
            if [ "$tag_type" != "tag" ]; then
              echo "existing tag must be annotated: $VERSION"
              exit 1
            fi

            tag_target="$(git rev-parse "refs/tags/$VERSION^{}")"
            if [ "$tag_target" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$tag_target" "origin/$DEFAULT_BRANCH"; then
                echo "existing tag $VERSION at $tag_target is not reachable from origin/$DEFAULT_BRANCH"
                exit 1
              fi
            fi

            echo "tag_exists=true" >> "$GITHUB_OUTPUT"
            echo "release_commit=$tag_target" >> "$GITHUB_OUTPUT"
            echo "Reusing existing tag $VERSION at $tag_target"
          else
            echo "tag_exists=false" >> "$GITHUB_OUTPUT"
            echo "release_commit=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout tagged commit
        if: steps.version_state.outputs.tag_exists == 'true'
        env:
          RELEASE_COMMIT: ${{ steps.version_state.outputs.release_commit }}
        run: git switch --detach "$RELEASE_COMMIT"

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp go.mod "$tmp/go.mod"
          cp go.sum "$tmp/go.sum"
          go mod tidy
          diff -u "$tmp/go.mod" go.mod
          diff -u "$tmp/go.sum" go.sum

      - name: Run framework checks
        run: make check GO=go GOFMT=gofmt COVERAGE_THRESHOLD="$COVERAGE_THRESHOLD"

      - name: Run scaffold checks
        run: make scaffold-check-local GO=go GOFMT=gofmt

      - name: Run scaffold checks against pinned dependency
        env:
          VERSION: ${{ inputs.version }}
        run: |
          template_framework_version="$(
            awk '
              $1 == "require" && $2 == "github.com/zxzharmlesszxz/prometheus-exporter-framework" {
                print $3
                exit
              }
              $1 == "github.com/zxzharmlesszxz/prometheus-exporter-framework" {
                print $2
                exit
              }
            ' scaffold/template/go.mod
          )"
          if [ -z "$template_framework_version" ]; then
            echo "scaffold/template/go.mod does not require prometheus-exporter-framework"
            exit 1
          fi
          if [ "$template_framework_version" = "$VERSION" ]; then
            echo "Skipping pinned scaffold check because scaffold/template/go.mod points at unreleased $VERSION"
            exit 0
          fi
          make scaffold-check-pinned GO=go GOFMT=gofmt

      - name: Verify workspace is clean
        run: |
          status="$(git status --porcelain --untracked-files=all -- ':!coverage.out' ':!coverage.txt' ':!dist/')"
          if [ -n "$status" ]; then
            echo "$status"
            exit 1
          fi

      - name: Create annotated tag
        if: steps.version_state.outputs.tag_exists != 'true'
        env:
          VERSION: ${{ inputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

  publish-release:
    name: Publish GitHub release
    runs-on: ubuntu-24.04
    container:
      image: golang:1.26.5-alpine
    needs:
      - tag-module

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash ca-certificates github-cli

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          gh release create "$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$VERSION"

  update-scaffold-template:
    name: Update scaffold framework pin
    runs-on: ubuntu-24.04
    container:
      image: golang:1.26.5-alpine
    needs:
      - publish-release

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.repository.default_branch }}

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Wait for Go proxy
        env:
          FRAMEWORK_MODULE: github.com/zxzharmlesszxz/prometheus-exporter-framework
          GOPROXY: https://proxy.golang.org
          VERSION: ${{ inputs.version }}
        run: |
          for attempt in $(seq 1 20); do
            if go list -m "${FRAMEWORK_MODULE}@${VERSION}" >/dev/null 2>&1; then
              echo "Go proxy has ${FRAMEWORK_MODULE}@${VERSION}"
              exit 0
            fi

            echo "Go proxy does not have ${FRAMEWORK_MODULE}@${VERSION} yet; retry ${attempt}/20"
            sleep 30
          done

          echo "Go proxy did not publish ${FRAMEWORK_MODULE}@${VERSION} in time"
          exit 1

      - name: Bump scaffold framework pin
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          FRAMEWORK_MODULE: github.com/zxzharmlesszxz/prometheus-exporter-framework
          GOPROXY: https://proxy.golang.org,direct
          VERSION: ${{ inputs.version }}
        run: |
          git fetch origin "$DEFAULT_BRANCH"
          git switch "$DEFAULT_BRANCH"
          git pull --ff-only origin "$DEFAULT_BRANCH"

          cd scaffold/template
          go mod edit -require "${FRAMEWORK_MODULE}@${VERSION}"
          go mod tidy
          cd ../..

          make scaffold-check-pinned GO=go GOFMT=gofmt

          if git diff --quiet -- scaffold/template/go.mod scaffold/template/go.sum; then
            echo "scaffold/template already points at ${VERSION}"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scaffold/template/go.mod scaffold/template/go.sum
          git commit -m "chore(scaffold): bump framework to ${VERSION}"
          git push origin "HEAD:${DEFAULT_BRANCH}"
