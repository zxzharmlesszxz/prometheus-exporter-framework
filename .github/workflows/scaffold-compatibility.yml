name: Scaffold Compatibility

on:
  push:
    branches:
      - "**"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FRAMEWORK_MODULE: github.com/zxzharmlesszxz/prometheus-exporter-framework

defaults:
  run:
    shell: bash

jobs:
  scaffold-compatibility:
    name: Render scaffold against current framework checkout
    runs-on: ubuntu-24.04
    container:
      image: golang:1.26.3-alpine

    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v6

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Render demo exporter
        run: |
          make -C scaffold new-exporter \
            PROJECT_NAME=prometheus-demo-exporter \
            GO_MODULE=github.com/example/prometheus-demo-exporter \
            PROJECT_DESC="Prometheus Demo Exporter" \
            FEATURE_NAME=demo \
            METRIC_NAMESPACE=demo_exporter \
            DEFAULT_PORT=9888 \
            TARGET_DIR="$RUNNER_TEMP/prometheus-demo-exporter"

      - name: Use current framework checkout
        working-directory: ${{ runner.temp }}/prometheus-demo-exporter
        run: |
          go mod edit -replace "$FRAMEWORK_MODULE=$GITHUB_WORKSPACE"
          go mod tidy

      - name: Verify generated exporter module files
        working-directory: ${{ runner.temp }}/prometheus-demo-exporter
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          cp go.mod "$tmp/go.mod"
          cp go.sum "$tmp/go.sum"

          go mod tidy
          diff -u "$tmp/go.mod" go.mod
          diff -u "$tmp/go.sum" go.sum

      - name: Check generated exporter
        working-directory: ${{ runner.temp }}/prometheus-demo-exporter
        run: |
          make go-check GO=go GOFMT=gofmt
