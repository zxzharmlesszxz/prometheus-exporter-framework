name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  COVERAGE_THRESHOLD: "90.0"

defaults:
  run:
    shell: bash

jobs:
  framework:
    name: Framework
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.0-alpine
    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Download modules
        run: go mod download

      - name: Verify module files
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          cp go.mod "$tmp/go.mod"
          cp go.sum "$tmp/go.sum"
          go mod tidy
          diff -u "$tmp/go.mod" go.mod
          diff -u "$tmp/go.sum" go.sum

      - name: Check formatting
        run: make fmt-check GO=go GOFMT=gofmt

      - name: Vet
        run: make vet GO=go

      - name: Staticcheck
        run: make staticcheck GO=go

      - name: Test with coverage
        run: make coverage-check GO=go COVERAGE_THRESHOLD="$COVERAGE_THRESHOLD"

      - name: Binary smoke test
        run: make smoke GO=go

      - name: Test with race detector
        run: make test-race GO=go

      - name: Check public API
        run: make public-api-check GO=go

      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            coverage.out
            coverage.txt
          if-no-files-found: ignore

  scaffold:
    name: Scaffold
    runs-on: ubuntu-24.04
    container:
      image: golang:1.27.0-alpine
    steps:
      - name: Prepare Alpine
        shell: sh
        run: apk add --no-cache bash build-base ca-certificates git make

      - name: Checkout
        uses: actions/checkout@v7

      - name: Trust checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Run scaffold checks
        run: make scaffold-check-local GO=go GOFMT=gofmt
