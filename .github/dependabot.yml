version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
    commit-message:
      prefix: chore
      include: scope
    groups:
      go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: chore
      include: scope
    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: gomod
    directory: /scaffold/template
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - go
      - scaffold
    commit-message:
      prefix: chore
      include: scope
    groups:
      scaffold-go-dependencies:
        patterns:
          - "*"

  - package-ecosystem: docker
    directory: /scaffold/template
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - docker
      - scaffold
    commit-message:
      prefix: chore
      include: scope
    groups:
      scaffold-docker-images:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /scaffold/template
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
      - scaffold
    commit-message:
      prefix: chore
      include: scope
    groups:
      scaffold-github-actions:
        patterns:
          - "*"
